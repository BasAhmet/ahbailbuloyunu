<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sınırsız İl Bulmaca</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 flex justify-center items-start">
    <div class="w-full max-w-2xl bg-white p-6 rounded-2xl shadow-xl mt-10">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-600">İl Bulmaca</h1>
            <!-- Skorun yanına ekleyebilirsin -->
            <div class="bg-red-100 text-red-800 px-4 py-2 rounded-xl font-bold text-lg shadow-sm">
                Kalan Hak: <span id="hakGosterge">6</span>
            </div>
            
            <!-- Tahmin butonunun yanına İpucu butonu -->
            <button id="ipucuBtn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl">
                💡 İpucu
            </button>
            <div class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-xl font-bold text-lg shadow-sm">
                Skor: <span id="skorGosterge">0</span>
            </div>
        </div>
        
        <!-- İl Şekli Görseli -->
        <div class="w-full bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl h-64 flex justify-center items-center mb-6 p-4">
            <svg id="ilSekli" viewBox="0 0 100 100" class="w-full h-full text-indigo-500 fill-current drop-shadow-md transition-all duration-500">
                <!-- Şekil JS ile buraya çizilecek -->
            </svg>
        </div>

        <div class="mb-6 flex gap-3">
            <input type="text" id="ilInput" list="illerList" class="flex-1 border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-lg transition" placeholder="Bu şekil hangi ile ait?">
            <datalist id="illerList"></datalist>
            <button id="tahminEtBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-indigo-200">
                Tahmin
            </button>
        </div>

        <!-- Sonuç & Yeni Oyun Alanı (Gizli başlar) -->
        <div id="sonucAlani" class="hidden mb-6 p-4 rounded-xl text-center">
            <h2 id="sonucMesaji" class="text-2xl font-bold mb-3"></h2>
            <button id="yeniOyunBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-2 rounded-lg transition shadow-md">
                Sıradaki İl ➔
            </button>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4 text-center font-bold text-slate-400 text-xs uppercase tracking-wider border-b-2 border-slate-100 pb-3">
            <div>İl</div>
            <div>Mesafe</div>
            <div>Yön</div>
            <div>Yakınlık</div>
        </div>

        <div id="tahminListesi" class="flex flex-col gap-3"></div>
    </div>

    <script>
        // 1. Veri Seti (Kısa örnek, gerçekte 81 il olacak)
        let iller = []; // Başlangıçta boş dizi     
        let hedefIl = null;
        let skor = 0;
        let oyunBitti = false;

        const ilInput = document.getElementById('ilInput');
        const illerList = document.getElementById('illerList');
        const tahminEtBtn = document.getElementById('tahminEtBtn');
        const tahminListesi = document.getElementById('tahminListesi');
        const skorGosterge = document.getElementById('skorGosterge');
        const ilSekli = document.getElementById('ilSekli');
        const sonucAlani = document.getElementById('sonucAlani');
        const sonucMesaji = document.getElementById('sonucMesaji');
        const yeniOyunBtn = document.getElementById('yeniOyunBtn');
        let kalanHak = 6;

        function ipucuAl() {
            if (kalanHak <= 1) {
                alert("Son hakta ipucu alamazsın!");
                return;
            }
            
            // İpucu türlerini belirleyelim
            const ipuclari = [
                `Bu ilin plaka kodu: ${hedefIl.plaka}`,
                `Bu il ${hedefIl.bolge} bölgesindedir.`,
                `Bu ilin komşularından biri: ${hedefIl.komsular[Math.floor(Math.random() * hedefIl.komsular.length)]}`
            ];
            
            // Rastgele birini seçip gösterelim
            const secilenIpucu = ipuclari[Math.floor(Math.random() * ipuclari.length)];
            
            // UI'da bir yere yazdıralım
            alert("İpucu: " + secilenIpucu);
            
            // İpucu almak 1 hak eksiltsin (stratejik bir karar)
            kalanHak--;
            guncelleHakGostergesi();
        }
        
        function tahminYap() {
            if (oyunBitti || kalanHak <= 0) return;
            
            // ... tahmin kontrol kodların ...
            
            // Her yanlış tahminde hak düşür
            kalanHak--;
            guncelleHakGostergesi();
            
            if (kalanHak <= 0 && mesafe !== 0) {
                alert("Hakların bitti! Oyun bitti. İl: " + hedefIl.isim);
                // Yeniden başlama mantığını tetikle
            }
        }
        // Veriyi dışarıdan çekme işlemi
        async function verileriYukle() {
            try {
                const response = await fetch('iller.json');
                iller = await response.json();
                
                // Veri yüklendikten sonra oyunu başlat
                init(); 
            } catch (error) {
                console.error("Veri yüklenemedi:", error);
                alert("İl haritaları yüklenirken bir sorun oluştu.");
            }
        }

        // Haversine Mesafe Formülü
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Dünya yarıçapı (km)
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return Math.round(R * c);
        }

        // Pusula Yönü Hesaplama
        function getBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            lat1 = lat1 * (Math.PI / 180);
            lat2 = lat2 * (Math.PI / 180);
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * (180 / Math.PI);
            brng = (brng + 360) % 360;
            const compass = ["⬆️ K", "↗️ KD", "➡️ D", "↘️ GD", "⬇️ G", "↙️ GB", "⬅️ B", "↖️ KB"];
            const index = Math.round(brng / 45) % 8;
            return compass[index];
        }

        function init() {
            illerList.innerHTML = '';
            iller.forEach(il => {
                const option = document.createElement('option');
                option.value = il.isim;
                illerList.appendChild(option);
            });
            yeniOyun();
        }

        function yeniOyun() {
            oyunBitti = false;
            tahminListesi.innerHTML = '';
            ilInput.value = '';
            sonucAlani.classList.add('hidden');
            ilInput.disabled = false;
            tahminEtBtn.disabled = false;
            
            // Rastgele il seçimi
            const rastgeleIndex = Math.floor(Math.random() * iller.length);
            hedefIl = iller[rastgeleIndex];
            
            // Şekli çizdir
            ilSekli.innerHTML = hedefIl.svgPaths.map(pathData => `<path d="${pathData}" />`).join('');
            // Zoom/BBox hesaplamasını da diziye uyarlayalım
            setTimeout(() => {
                // Tüm path'leri kapsayan bir grup oluşturup onun bbox'ını alabiliriz
                // Veya SVG'nin kendi getBBox() fonksiyonu zaten tüm içerikleri hesaplar
                const bbox = ilSekli.getBBox(); 
                const padding = 10;
                ilSekli.setAttribute('viewBox', `${bbox.x - padding} ${bbox.y - padding} ${bbox.width + (padding * 2)} ${bbox.height + (padding * 2)}`);
            }, 10);
            console.log("Gizli İl:", hedefIl.isim);

        }

        function tahminYap() {
            if (oyunBitti) return;
            
            const tahminIsim = ilInput.value.trim();
            const tahminEdilenIl = iller.find(il => il.isim.toLocaleLowerCase('tr-TR') === tahminIsim.toLocaleLowerCase('tr-TR'));

            if (!tahminEdilenIl) {
                alert("Lütfen geçerli bir il girin.");
                return;
            }

            const mesafe = getDistance(tahminEdilenIl.lat, tahminEdilenIl.lng, hedefIl.lat, hedefIl.lng);
            const yon = mesafe === 0 ? "🎯" : getBearing(tahminEdilenIl.lat, tahminEdilenIl.lng, hedefIl.lat, hedefIl.lng);
            
            // Maksimum mesafe Türkiye için ortalama 1600km baz alınarak yakınlık yüzdesi hesabı
            let yakinlik = Math.max(0, 100 - Math.round((mesafe / 1600) * 100));
            if(mesafe === 0) yakinlik = 100;

            const satir = document.createElement('div');
            satir.className = "grid grid-cols-4 gap-2 bg-slate-50 p-3 rounded-lg items-center text-center font-semibold text-slate-700 animate-[bounce_0.3s_ease-in-out]";
            
            let bgRenk = mesafe === 0 ? 'bg-green-500' : 
                         yakinlik > 80 ? 'bg-yellow-400' : 'bg-slate-200';

            satir.innerHTML = `
                <div class="truncate px-1">${tahminEdilenIl.isim}</div>
                <div>${mesafe} km</div>
                <div class="text-xl">${yon}</div>
                <div>
                    <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
                        <div class="${bgRenk} h-4" style="width: ${yakinlik}%"></div>
                    </div>
                </div>
            `;
            
            tahminListesi.prepend(satir); // En son tahmini en üste ekler
            ilInput.value = '';

            if (mesafe === 0) {
                oyunBitti = true;
                skor += 10; // Doğru bilince 10 puan
                skorGosterge.innerText = skor;
                ilInput.disabled = true;
                tahminEtBtn.disabled = true;
                
                sonucMesaji.innerText = `Tebrikler! ${hedefIl.isim} ilini buldun!`;
                sonucAlani.classList.remove('hidden');
                sonucAlani.classList.add('bg-green-100', 'text-green-800');
            }
        }

        tahminEtBtn.addEventListener('click', tahminYap);
        ilInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') tahminYap(); });
        yeniOyunBtn.addEventListener('click', yeniOyun);

        verileriYukle();
        //init();
    </script>
</body>
</html>
